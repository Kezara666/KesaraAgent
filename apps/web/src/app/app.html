<header class="topbar">
  <span class="brand">Kesara Agent</span>
  @if (auth.isSignedIn()) {
    <nav aria-label="Main">
      <a routerLink="/tasks" routerLinkActive="active">Tasks</a>
      <a routerLink="/approvals" routerLinkActive="active">Approvals</a>
      <a routerLink="/schedules" routerLinkActive="active">Schedules</a>
      <a routerLink="/workspace" routerLinkActive="active">Workspace</a>
      <a routerLink="/audit" routerLinkActive="active">Audit</a>
      <button type="button" class="secondary" (click)="signOut()">Sign out</button>
    </nav>
  }
</header>
<main>
  <router-outlet />
</main>
